[package]
name = "deepbsa"
version = "2.0.0"
edition = "2021"
description = "DeepBSA rewritten in pure Rust: deep-learning-based bulk segregant analysis QTL mapping"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
csv = "1"
flate2 = "1"
ndarray = { version = "0.16", features = ["rayon"] }
plotters = { version = "0.3", default-features = false, features = ["bitmap_backend", "bitmap_encoder", "ab_glyph"] }
rand = "0.8"
rand_distr = "0.4"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
